# Security response headers for the registration documents (specification § 11).
#
# This snippet exists because nginx's `add_header` is not additive across levels: a
# location block that declares any `add_header` of its own discards every `add_header`
# inherited from the server block. Declaring these once at server level therefore silently
# loses them on exactly the locations that set a Cache-Control header — which is every
# location that serves an HTML document. Including the snippet explicitly in each document
# location is the only form that cannot be broken by adding a header somewhere else later.
#
# `always` keeps the headers on error responses too, including the 404 produced by
# `try_files`.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
