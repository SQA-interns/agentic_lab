# Static hosting for the registration pages, plus a same-origin proxy to the API
# (specification § 11, § 13).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64k;

    location /api/ {
        # The API is not a document: the backend sets its own, stricter response headers
        # (helmet), so the document policy in security-headers.conf is deliberately not
        # applied here. Adding it would emit a second Content-Security-Policy header on
        # every API response.
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # Vite emits content-hashed asset names, so they are safe to cache immutably.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
