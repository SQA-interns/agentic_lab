spring:
  application:
    name: registration-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/registration}
    username: ${DATABASE_USER:registration}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.starttls.required: ${SMTP_TLS:false}
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

app:
  conference-name: ${CONFERENCE_NAME:Conference}
  mail:
    from: ${MAIL_FROM:registration@conference.local}
  options-file: ${OPTIONS_FILE:classpath:conference-options.json}
  json-copy-dir: ${JSON_COPY_DIR:./data/json}
  recaptcha:
    test-mode: ${RECAPTCHA_TEST_MODE:false}
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
  organizer:
    username: ${ORGANIZER_USERNAME:}
    password: ${ORGANIZER_PASSWORD:}
    emails: ${ORGANIZER_EMAILS:}
    https-only: ${ORGANIZER_HTTPS_ONLY:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    registration-per-minute: ${RATE_LIMIT_REGISTRATION_PER_MINUTE:10}
    export-per-minute: ${RATE_LIMIT_EXPORT_PER_MINUTE:10}
    read-per-minute: ${RATE_LIMIT_READ_PER_MINUTE:120}
  max-request-bytes: ${MAX_REQUEST_BYTES:16384}
