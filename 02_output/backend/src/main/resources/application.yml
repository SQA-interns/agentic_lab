# Settings come from environment variables of the same name (ES-01, specification section 3).
# Secrets have no default here.
spring:
  application:
    name: registration-backend
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
server:
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 64KB
management:
  health:
    endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  level:
    org.hibernate.SQL: warn
