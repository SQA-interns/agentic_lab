spring:
  application:
    name: registration-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/registration}
    username: ${DATABASE_USER:registration}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: 8080
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
