# Environment-specific values come from the environment variables of specification section 3,
# mapped by config.EnvironmentAliases only when set (ES-01). Defaults that are allowed live in
# config.AppProperties; secrets have no default and StartupChecks refuses to start without them.
spring:
  application:
    name: registration-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: ${app.mail.starttls:true}
      mail.smtp.starttls.required: ${app.mail.starttls:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  # Honour X-Forwarded-For/-Proto from trusted (internal) proxies only.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
  tomcat:
    max-swallow-size: 64KB
    max-http-form-post-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,jsonCopyDirectory
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
