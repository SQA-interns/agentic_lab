# Settings come from environment variables of the same name (ES-01, specification section 3).
# Secrets have no default here.
spring:
  application:
    name: registration-backend
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
      # RFC 5321 4.5.3.2 lets a server take minutes; sending is asynchronous (F-01).
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 60000
      mail.smtp.writetimeout: 60000
  mvc:
    problemdetails:
      enabled: false
server:
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 64KB
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  level:
    org.hibernate.SQL: warn
