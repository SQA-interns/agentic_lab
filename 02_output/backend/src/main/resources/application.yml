spring:
  application:
    name: registration-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/registration}
    username: ${DB_USERNAME:registration}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
