# Production: no local defaults for environment-specific settings (02_contracts/configuration.md).
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    properties:
      # TLS to the SMTP server unless explicitly switched off (SB-04)
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
app:
  options-file: ${OPTIONS_FILE}
