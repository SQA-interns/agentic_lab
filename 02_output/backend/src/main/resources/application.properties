spring.application.name=registration

# Settings of the specification (section 5); environment variables on the right.
app.environment=${APP_ENVIRONMENT:production}
app.mail-from=${MAIL_FROM:prijave@konferenca.example}
app.conference-name=${CONFERENCE_NAME:Konferenca}
app.organizer-emails=${ORGANIZER_EMAILS}
app.options-file=${OPTIONS_FILE}
app.consent-text=${CONSENT_TEXT:Soglašam z obdelavo svojih osebnih podatkov za namen prijave na konferenco.}
app.json-copy-dir=${JSON_COPY_DIR:/data/registrations}
app.recaptcha.test-mode=${RECAPTCHA_TEST_MODE:false}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.verify-url=${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
app.organizer.username=${ORGANIZER_USERNAME}
app.organizer.password=${ORGANIZER_PASSWORD}
app.organizer.require-https=${ORGANIZER_REQUIRE_HTTPS:true}
app.cors-allowed-origin=${CORS_ALLOWED_ORIGIN:}
app.rate-limit.registration=${RATE_LIMIT_REGISTRATION:10}
app.rate-limit.export=${RATE_LIMIT_EXPORT:10}
app.rate-limit.read=${RATE_LIMIT_READ:120}
app.max-request-bytes=${MAX_REQUEST_BYTES:16384}
app.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Only health is exposed; readiness includes the database (ES-09, NFR-04).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
