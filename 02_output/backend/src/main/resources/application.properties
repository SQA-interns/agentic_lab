spring.application.name=registration-backend

# Settings of docs/02_specification.md §9. Secrets and environment-specific values have no default.
app.environment=${APP_ENVIRONMENT:production}
app.conference-name=${CONFERENCE_NAME:Conference}
app.conference-config-file=${CONFERENCE_CONFIG_FILE:}
app.json-copy-dir=${JSON_COPY_DIR:/data/registrations}
app.mail-from=${MAIL_FROM:no-reply@konferenca.si}
app.smtp-tls=${SMTP_TLS:true}
app.allowed-origins=${ALLOWED_ORIGINS:}
app.recaptcha.test-mode=${RECAPTCHA_TEST_MODE:false}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.verify-url=${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
app.organizer.username=${ORGANIZER_USERNAME:}
app.organizer.password=${ORGANIZER_PASSWORD:}
app.organizer.emails=${ORGANIZER_EMAILS:}
app.organizer.https-only=${ORGANIZER_HTTPS_ONLY:true}
app.limits.registrations-per-minute=${RATE_LIMIT_REGISTRATIONS_PER_MINUTE:10}
app.limits.exports-per-minute=${RATE_LIMIT_EXPORTS_PER_MINUTE:10}
app.limits.form-config-per-minute=60
app.limits.max-request-bytes=${MAX_REQUEST_BYTES:16384}

# Database (AR-06: schema only through Flyway)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Mail
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JSON: unknown properties are malformed requests
spring.jackson.deserialization.fail-on-unknown-properties=true

# Errors never show internals (ES-07)
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Behind the production reverse proxy: X-Forwarded-* only from internal proxies (SR-06)
server.forward-headers-strategy=native

# Health and readiness (NFR-04, ES-09)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
