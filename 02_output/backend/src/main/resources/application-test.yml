# Defaults allowed only in automated tests (environments.md): database, mail catcher, options.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/registration}
    username: ${DB_USERNAME:registration}

app:
  smtp:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    starttls: ${SMTP_STARTTLS:false}
  options-file: ${CONFERENCE_OPTIONS_FILE:classpath:contracts/conference-options.example.json}
