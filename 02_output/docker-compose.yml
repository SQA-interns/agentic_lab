# Local stack (environments.md, "local"). Start from 02_output/:
#   docker compose --env-file ../.env up -d --build
name: registration

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registration -d registration"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/registration
      DATABASE_USER: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: registration@conference.local
      CONFERENCE_NAME: ${CONFERENCE_NAME:-Conference 2026}
      JSON_COPY_DIR: /data/json
      # local only: deterministic reCAPTCHA test mode, plain HTTP on 127.0.0.1 (environments.md)
      RECAPTCHA_TEST_MODE: "true"
      ORGANIZER_HTTPS_ONLY: "false"
      ORGANIZER_USERNAME: ${ORGANIZER_USERNAME:?set ORGANIZER_USERNAME in .env}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:?set ORGANIZER_PASSWORD in .env}
      ORGANIZER_EMAILS: ${ORGANIZER_EMAILS:?set ORGANIZER_EMAILS in .env}
    volumes:
      - jsondata:/data/json
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  jsondata:
