# Local stack (environments.md "local"): docker compose --env-file ../.env up -d --build
# Secrets come from the repository-root .env (secrets.env.example); ports bind to 127.0.0.1 only.
name: konferenca-registration

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registration -d registration"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  backend:
    build: ./backend
    image: konferenca-registration-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/registration
      DB_USERNAME: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ORGANIZER_USERNAME: ${ORGANIZER_USERNAME:?set ORGANIZER_USERNAME in .env}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:?set ORGANIZER_PASSWORD in .env}
      ORGANIZER_EMAILS: ${ORGANIZER_EMAILS:?set ORGANIZER_EMAILS in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      JSON_COPY_DIR: /data/json-copies
      CONFERENCE_NAME: ${CONFERENCE_NAME:-Konferenca 2026}
      CORS_ALLOWED_ORIGIN: ""
    volumes:
      - jsoncopies:/data/json-copies
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: konferenca-registration-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:8080"
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      backend:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
  jsoncopies:
