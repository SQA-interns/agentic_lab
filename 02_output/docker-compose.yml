# Local stack (environments.md "local"): plain HTTP on 127.0.0.1 only.
# Start from 02_output/ after building the backend jar:
#   docker compose --env-file ../.env up -d --build
# Secrets come only from the repository-root .env; each service receives only what it needs.
name: conference-registration

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registration -d registration"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build: ./backend
    image: conference-registration-backend:1.0.0
    environment:
      APP_ENVIRONMENT: local
      DB_URL: jdbc:postgresql://postgres:5432/registration
      DB_USERNAME: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-registration@konferenca.si}
      CONFERENCE_NAME: ${CONFERENCE_NAME:-Konferenca 2026}
      ORGANIZER_USERNAME: ${ORGANIZER_USERNAME:?set ORGANIZER_USERNAME in .env}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:?set ORGANIZER_PASSWORD in .env}
      ORGANIZER_EMAILS: ${ORGANIZER_EMAILS:?set ORGANIZER_EMAILS in .env}
      # Allowed only on local plain HTTP (environments.md); production refuses both (S-1, S-3).
      ORGANIZER_HTTPS_ONLY: "false"
      RECAPTCHA_TEST_MODE: "true"
      RATE_LIMIT_REGISTRATION: ${RATE_LIMIT_REGISTRATION:-20}
      RATE_LIMIT_EXPORT: ${RATE_LIMIT_EXPORT:-10}
    volumes:
      - registration-copies:/data/registrations
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: conference-registration-frontend:1.0.0
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db-data:
  registration-copies:
