# Local stack (environments.md, "local"): plain HTTP on 127.0.0.1 only.
# Secrets come from the environment; start it with
#   bash 01_input/00_general/tools/secrets.sh run POSTGRES_PASSWORD,ORGANIZER_USERNAME,ORGANIZER_PASSWORD,ORGANIZER_EMAILS \
#     -- docker compose -f 02_output/docker-compose.yml up -d --build
# after building the backend jar (cd 02_output/backend && ./mvnw -B -DskipTests package).
name: registration

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: registration
      POSTGRES_USER: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registration -d registration"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/registration
      DB_USERNAME: registration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: registrations@konferenca.example.si
      CONFERENCE_NAME: Konferenca 2026 (local)
      JSON_COPY_DIR: /data/json-copies
      RECAPTCHA_TEST_MODE: "true"
      ORGANIZER_USERNAME: ${ORGANIZER_USERNAME:?ORGANIZER_USERNAME is not set}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:?ORGANIZER_PASSWORD is not set}
      ORGANIZER_EMAILS: ${ORGANIZER_EMAILS:?ORGANIZER_EMAILS is not set}
      ORGANIZER_HTTPS_ONLY: "false"
      RATE_LIMIT_REGISTRATIONS: "100"
      RATE_LIMIT_TOKENS: "30"
      RATE_LIMIT_EXPORTS: "30"
      RATE_LIMIT_FORM_CONFIG: "300"
    volumes:
      - jsoncopies:/data/json-copies
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  jsoncopies:
