# Runs as the unprivileged nginx user: writable paths only under /tmp (SB-11).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;

  # No client addresses in the access log (ES-07).
  log_format minimal '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout minimal;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 32k;

  upstream backend {
    server backend:8080;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # KP-01: never build redirects from the client-supplied host.
    absolute_redirect off;

    location /api/ {
      proxy_pass http://backend;
      # KP-01: fixed host; the client address replaces any client-supplied X-Forwarded-For.
      proxy_set_header Host backend;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      return 200 "ok\n";
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
