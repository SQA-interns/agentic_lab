# Serves the built page and proxies /api to the backend (AR-01).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 64k;

  location /api/ {
    proxy_pass http://backend:8080;
    # Host with its port, so the backend sees the page's own origin (no CORS for same origin).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Passed on only when an outer HTTPS proxy set it; an empty value is not sent.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location / {
    # Security headers of the page (SB-10); the API sets its own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
}
