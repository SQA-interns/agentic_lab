# nginx for the frontend container: static files, and /api forwarded to the backend in the local
# stack. Runs as a non-root user, so every file it writes is below /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  server_tokens off;
  sendfile on;
  # No access log: it would hold client addresses, and nothing here needs them (ES-07).
  access_log off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;

    # A fixed destination, never taken from the request. The name "backend" must resolve on the
    # container network when nginx starts (the compose service, or a network alias in production).
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      # This proxy is the one the backend trusts for the client address and scheme.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    location / {
      try_files $uri /index.html;
      # Security headers of the page (SB-10). The reCAPTCHA origins are the only external ones.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Cache-Control "no-cache" always;
    }
  }
}
