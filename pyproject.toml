[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-registration"
version = "1.0.0"
description = "Conference participant registration system"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "email-validator==2.3.0",
  "fastapi==0.135.1",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.10",
  "pydantic==2.12.5",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.42.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "httpx2==2.13.0",
  "mypy==1.18.1",
  "pip-audit==2.9.0",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
