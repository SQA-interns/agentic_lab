# Default (production) configuration. Every secret/environment value comes from env vars.
spring:
  application:
    name: conference-registration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: native
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  tomcat:
    remoteip:
      # Trust only proxies on private networks (external nginx / frontend nginx), AR-08.
      internal-proxies: ${APP_TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}}
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,backupStorage
        liveness:
          include: livenessState
  health:
    mail:
      enabled: false

app:
  catalog:
    path: ${APP_CATALOG_PATH}
  backup:
    directory: ${APP_BACKUP_DIR}
    reconcile-grace: PT10M
    reconcile-interval: PT10M
  captcha:
    mode: recaptcha
    site-key: ${APP_CAPTCHA_SITE_KEY:}
    secret: ${APP_CAPTCHA_SECRET:}
  organizer:
    username: ${APP_ORGANIZER_USERNAME:}
    password: ${APP_ORGANIZER_PASSWORD:}
  mail:
    from: ${APP_MAIL_FROM}
    organizer-recipients: ${APP_ORGANIZER_EMAILS}
    dispatch-enabled: true
    dispatch-interval: PT5S
    max-attempts: 12
    batch-size: 10
    initial-backoff: PT30S
    max-backoff: PT30M
  web:
    max-body-bytes: 32768
    rate-limit-per-minute: ${APP_RATE_LIMIT_PER_MINUTE:20}

logging:
  level:
    root: INFO
