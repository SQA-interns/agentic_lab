spring:
  application:
    name: registration-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/conference}
    username: ${SPRING_DATASOURCE_USERNAME:conference}
    password: ${SPRING_DATASOURCE_PASSWORD:conference}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

app:
  recaptcha:
    test-mode: ${RECAPTCHA_TEST_MODE:false}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    site-key: ${RECAPTCHA_SITE_KEY:}
  mail:
    from: ${APP_MAIL_FROM:no-reply@conference.local}
    organizer-emails: ${APP_ORGANIZER_EMAILS:}
  backup:
    dir: ${APP_BACKUP_DIR:./data/registrations}
  options:
    file: ${APP_OPTIONS_FILE:}
  organizer:
    username: ${ORGANIZER_USERNAME:organizer}
    password: ${ORGANIZER_PASSWORD:}
  rate-limit:
    registration:
      requests: ${APP_RATE_LIMIT_REGISTRATION_REQUESTS:10}
      window-seconds: ${APP_RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:600}
    organizer:
      requests: ${APP_RATE_LIMIT_ORGANIZER_REQUESTS:30}
      window-seconds: ${APP_RATE_LIMIT_ORGANIZER_WINDOW_SECONDS:600}
  request:
    max-body-bytes: ${APP_REQUEST_MAX_BODY_BYTES:16384}
