# Served by nginxinc/nginx-unprivileged (non-root, listens on 8080).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16k;

    # Hashed build assets: cache long, still with security headers.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # REST API is proxied to the backend; the backend sets its own security headers.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Host is left at nginx's default ($proxy_host); the client-supplied Host is not forwarded.
        # Overwrite (not append) so clients cannot spoof their address for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA routes fall back to index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
