# Example external nginx (host) for production (AR-08). TLS + Let's Encrypt (certbot webroot).
# Forwards everything to the frontend container, which routes /api to the backend.
server {
    listen 80;
    server_name registration.example.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name registration.example.org;
    ssl_certificate     /etc/letsencrypt/live/registration.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registration.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        # Overwrite (not append) client-supplied values: only this proxy's view is trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
